[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not external and not performance and not manual"
filterwarnings =
    ignore:The 'validate_default' attribute with value True was provided to the `Field\(\)` function: pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:Type google\._upb\._message\..* uses PyType_Spec with a metaclass that has custom tp_new: DeprecationWarning
markers =
    external: tests that require external services such as LM Studio, Telegram, Redis, or PostgreSQL
    performance: load, timing, or benchmark-style tests that are useful locally but too slow for default CI
    manual: script-style verification tests that are not part of the deterministic default suite
