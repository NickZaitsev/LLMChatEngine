name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt

      - name: Run lint
        run: |
          ruff check .

      - name: Run type check
        run: |
          mypy messaging --ignore-missing-imports

      - name: Verify repository structure
        run: |
          python tests/verify_code_structure.py

      - name: Run deterministic test suite
        run: |
          pytest -q
